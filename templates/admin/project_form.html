{% extends "base.html" %}{% block title %}Add Project{% endblock %}{% block content %}<main class="container page form-page"><a class="back-link" href="{{ url_for('admin') }}">← Dashboard</a><div class="form-heading"><div class="section-label">NEW PROJECT</div><h1>Add a <em>project.</em></h1></div><form class="admin-form" method="post" enctype="multipart/form-data"><label>Project name<input name="name" required></label><label>Description<textarea name="description" rows="5" required></textarea></label><label>Project screenshot<input type="file" name="image" accept="image/*"></label><label>Project URL<input type="url" name="project_url" placeholder="https://"></label><label class="check"><input type="checkbox" name="featured"> Show on landing page</label><button class="button button-primary">Save project →</button></form></main>{% endblock %}
