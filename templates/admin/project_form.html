{% extends "base.html" %}{% block title %}{{ "Edit Project" if editing else "Add Project" }}{% endblock %}{% block content %}<main class="container page form-page"><a class="back-link" href="{{ url_for('admin') }}">← Dashboard</a><div class="form-heading"><div class="section-label">{{ "EDIT PROJECT" if editing else "NEW PROJECT" }}</div><h1>{{ "Edit a" if editing else "Add a" }} <em>project.</em></h1></div><form class="admin-form" method="post" enctype="multipart/form-data"><label>Project name<input name="name" value="{{ project.name if project else '' }}" required></label><label>Description<textarea name="description" rows="5" required>{{ project.description if project else '' }}</textarea></label><label>Project screenshot{% if editing and project.image_url %}<small class="muted">Current screenshot is kept unless you upload a new one.</small>{% endif %}<input type="file" name="image" accept="image/*"></label><label>Project URL<input type="url" name="project_url" value="{{ project.project_url if project else '' }}" placeholder="https://"></label><label class="check"><input type="checkbox" name="featured" {% if project and project.featured %}checked{% endif %}> Show on landing page</label><button class="button button-primary">{{ "Update project" if editing else "Save project" }} →</button></form></main>{% endblock %}
