{% extends "base.html" %}{% block title %}Add Certification{% endblock %}{% block content %}<main class="container page form-page"><a class="back-link" href="{{ url_for('admin') }}">← Dashboard</a><div class="form-heading"><div class="section-label">NEW CERTIFICATION</div><h1>Add a <em>certificate.</em></h1></div><form class="admin-form" method="post" enctype="multipart/form-data"><label>Name<input name="name" required></label><label>Issuer<input name="issuer" required></label><label>Date<input name="date"></label><label>Certificate (PDF or image)<input type="file" name="file" accept=".pdf,image/*" required></label>{% if error %}<div class="form-error">{{ error }}</div>{% endif %}<button class="button button-primary">Save certification →</button></form></main>{% endblock %}
